<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Café Aroma - Cadastro de Usuário</title>
</head>
<body bgcolor="#F5F5DC">
    <center>
        <header>
            <br>
            <h1> Criar Novo Usuário </h1>
        </header>

        <main>
            <form action="index.html">
                <label>Nome Completo 👤:</label><br>
                <input type="text" name="nome" required><br><br>

                <label>Endereço Completo 🏠:</label><br>
                <input type="text" name="endereco" size="50"><br><br>

                <label>E-mail 📧:</label><br>
                <input type="email" name="email" required><br><br>

                <label>Defina seu Usuário 🆔:</label><br>
                <input type="text" name="login_novo" required><br><br>

                <label>Sua Senha 🔑:</label><br>
                <input type="password" name="senha_nova" required><br><br>

                <label>Confirme sua Senha ✅:</label><br>
                <input type="password" name="confirma_senha" required><br><br>

                <button type="submit">Finalizar Cadastro ☕</button>
                <button type="reset">Limpar Campos 🧹</button>
            </form>
            <br>
            <a href="index.html">🔙 Voltar para o Login</a>
        </main>
    </center>
</body>
</html>
